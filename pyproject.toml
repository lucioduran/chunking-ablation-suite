[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chunking-ablation-suite"
version = "0.1.0"
description = "Reproducible local chunking experiments with evidence-span retrieval scoring"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = []

[project.scripts]
chunking-suite = "chunking_suite.cli:main"

[tool.setuptools.packages.find]
include = ["chunking_suite*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["chunking_suite"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
